name: Desktop tagging tests
on: [push, pull_request]
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[desktop-test]"
      - run: python scripts/test_desktop.py
